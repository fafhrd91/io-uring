name: Coverage

on: [pull_request, push]

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Clean coverage results
        run: cargo llvm-cov clean --workspace

      - name: Code coverage (unit tests)
        run: cargo llvm-cov --no-report -p ntex-io-uring

      - name: Code coverage (io-uring-test)
        timeout-minutes: 10
        run: cargo llvm-cov run --no-report -p io-uring-test --features io-uring-test/ci

      - name: Generate coverage report
        run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "io-uring-(test|bench)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
